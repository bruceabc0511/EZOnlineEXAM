<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <title>測驗連線 QR Code</title>
  <!-- 本地端 QR Code 生成器 (防範隨機測驗連結 Token 外洩至第三方 QR API 伺服器，並加入 SRI 完整性保護) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"
    integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz"
    crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

     html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-standalone-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #standaloneQrImg {
      width: min(80vmin, 520px);
      height: min(80vmin, 520px);
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <div class="qr-standalone-container">
    <img id="standaloneQrImg" alt="測驗連線 QR Code">
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let targetUrl = params.get('data');

      if (!targetUrl) {
        const baseUrl = window.location.origin + window.location.pathname.replace(/\/qr\.html$/i, '/index.html');
        targetUrl = baseUrl + '?role=student';
      }

      const qrImg = document.getElementById('standaloneQrImg');
      if (typeof qrcode === 'function') {
        const qr = qrcode(0, 'M');
        qr.addData(targetUrl);
        qr.make();
        qrImg.src = qr.createDataURL(10, 4);
      }
    })();
  </script>
</body>

</html>
